# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Shared base: pissmyran/coderabbit; keep shared settings there.
inheritance: true

reviews:
  path_instructions:
    # GTK and worker execution paths.
    - path: "LinuxApp/src/**/*.rs"
      instructions: |
        When UI or background work changes, trace the caller and execution
        context. GTK, libadwaita and VTE access belongs on the GTK main thread;
        worker results return through channels to the GLib main context.
        Check that blocking filesystem, process, network or expensive crypto
        work does not stall the UI or a Tokio executor. GLib local futures
        still run on the UI thread; async alone does not move work off it.
        For changed worker, task or channel lifetimes, check cancellation,
        dropped receivers and error paths for leaked sessions, listeners,
        child processes or tasks, and stale results applied to closed UI.
        Use AGENTS.md and docs/operations.md for local verification requirements.
        Workspace tests run locally, not in GitHub CI; missing build evidence
        is a verification limitation, not by itself a confirmed code defect.

    # Workspace dependencies and the RSA exclusion.
    - path: "LinuxApp/{Cargo.toml,Cargo.lock,integrations/Cargo.toml}"
      instructions: |
        Check dependency changes in the manifest that owns the dependency:
        the app and bastion-integrations are separate workspace packages.
        Check manifest and shared lockfile consistency, including resolved
        versions and feature changes. Check compatibility with each package's
        declared rust-version; do not infer support from edition alone or
        claim a toolchain was tested without evidence.
        Preserve russh's disabled default features and intentional non-RSA
        features. Check transitive dependencies and feature unification for
        reintroduction of rsa, not just direct manifest entries.
        Per docs/rsa-disabled.md, RSA may return only with a version fixing
        RUSTSEC-2023-0071 and regression tests for RSA paths, including key
        files, certificates and ssh-agent authentication.

    # Separate command-building and parsing package.
    - path: "LinuxApp/integrations/**"
      instructions: |
        Preserve bastion-integrations as a separate workspace package for
        command construction, input validation and output parsing. Its current
        dependency is serde_json; the app owns SSH execution and GTK UI.
        Check that changes do not introduce GTK or SSH runtime coupling or
        move execution into this package without an explicit architectural
        change. Trace app callers when command or parser contracts change.

    # SSH trust and authentication.
    - path: "LinuxApp/src/{known_hosts,ssh}.rs"
      instructions: |
        When host key verification or authentication changes, check
        that TOFU still distinguishes the first connection from a changed
        key for the same host and port. A changed key must be rejected.
        Also check separate commands, SFTP and every ProxyJump hop
        where those connection paths exist.
        When agent forwarding changes, check that the user's
        explicit forwardAgent choice still controls access.

    # Concurrency and connection lifetime.
    - path: "LinuxApp/src/ssh.rs"
      instructions: |
        When connect, keepalive or close changes, trace concurrent
        connect, channel-open and close sequences and auth failures.
        Trace Result propagation, async-channel sends and receives, and
        Tokio timeouts/select branches so auth failures, dropped receivers
        and closed channels do not leave callers waiting indefinitely.
        Check worker/runtime and SSH handle lifetimes when a caller cancels
        or closes input, including a connection that completes after close.
        Preserve russh keepalive configuration and connection-loss reporting;
        late events from an old session must not affect its replacement.
        Use the session tests as regression evidence.

    # Persistent format and merging.
    - path: "{LinuxApp/src/{host,snippet,sync,fsutil}.rs,LinuxApp/tests/fixtures/{host-wire-format,sync-state-wire-format}.json}"
      instructions: |
        The format is owned by bastion_apple; follow docs/sync-format.md.
        Fixtures are copies of the Apple fixtures, not a Linux-only contract.
        When serialization or storage changes, compare field names,
        UUID encoding, the 2001-01-01 date epoch and the tombstone format
        with existing readers and the wire-format fixtures.
        Check reading of older Host lists and, where snippets
        are included, state without the snippets field.
        Check that merge is idempotent and order independent,
        also with equal modifiedAt. A tombstone at least as new must
        win over the entry. Shared tombstones must not be dropped
        when hosts and snippets are stored in separate files.
        Check that changed write paths keep the complete previous
        data on failure and do not lose concurrent local changes.
        Do not assume identical feature support across platforms.
        Never change fixtures just to hide a format break.

    # Encrypted sync format.
    - path: "LinuxApp/src/sync_crypto.rs"
      instructions: |
        When the envelope or the cryptography changes, check BSYNC1,
        the big-endian encoding of the iteration field, salt and the order
        nonce, ciphertext, tag against the other implementations.
        Check PBKDF2-HMAC-SHA256, AES-256-GCM, a fresh salt
        and a fresh nonce, and rejection of tampered envelopes.
        The input iteration count must be bounded before key derivation.
        Check compatibility with existing encrypted files
        and known test vectors. A wrong passphrase or corrupt data must
        never be read as an empty state that is then written back.

    # OAuth and cloud sync.
    - path: "LinuxApp/src/{oauth,sync_webdav}.rs"
      instructions: |
        When the OAuth flow changes, check the link between PKCE,
        state, the callback and the redirect_uri used in the code exchange.
        On token refresh, check concurrent calls for the same
        provider and that a rotated refresh token is stored without
        another refresh writing back an older value.
        If the response has no refresh token, keep the previous one.
        When sync transport changes, separate a missing file from denied access,
        network errors and a corrupt payload before any push.
        Do not assume that WebDAV uses the same encrypted format as Apple.
        WebDAV credentials may only be sent over HTTPS or
        to the explicitly allowed loopback address.
        Check that error messages never expose tokens or raw
        response bodies that may contain credentials.

    # TCP and SOCKS forwarding.
    - path: "LinuxApp/src/{port_forward,socks_proxy}.rs"
      instructions: |
        When binding changes, check that local and dynamic
        forwards are not accidentally exposed beyond loopback.
        Separate the local bind from the intended remote bind address.
        With remote port 0, the assigned port must be used for registration
        and deregistration. Reject incoming forwarded-tcpip
        that does not match an active forward.
        Check that listeners and active bridges close on error
        or exit, and that SOCKS replies match the connection result.

    # Command builders for remote systems.
    - path: "{LinuxApp/src/{archive,key_deploy}.rs,LinuxApp/integrations/src/docker.rs}"
      instructions: |
        When file names, keys or Docker references reach a command,
        check correct quoting for the actual shell and protection
        against both shell injection and flag injection.
        Separate container names from image references with a registry,
        tag or digest. Validation must not confuse the formats.
        On key deploy, existing authorized_keys must be kept.
        Check idempotence and verification with the new key.
        When the process runner changes, check concurrent draining
        of stdout and stderr so full pipe buffers never block the process.

    # Fetching executable tools.
    - path: "LinuxApp/src/{external_binary_fetcher,tool_release}.rs"
      instructions: |
        When fetching or caching changes, check that both downloaded
        and reused bytes are verified against the expected SHA256 before
        they are handed out as a valid executable.
        For archive downloads, separate the archive checksum from the
        checksum of the extracted binary.
        Check the selected OS, architecture and archive member, and that
        untrusted names cannot write outside the cache directory.
        A bad cache entry must never run as a fallback on network errors.

    # S3-compatible services.
    - path: "LinuxApp/src/s3.rs"
      instructions: |
        When SigV4 or URL building changes, compare the canonical request
        with the URL, Host header, query string and payload that are sent.
        Check non-standard ports, special characters in object keys,
        sorted query parameters and existing path-style support.
        Check signature vectors and that HTTP errors are never reported
        as successful object operations.

    # Publishing releases.
    - path: ".github/{workflows/release.yml,scripts/semantic_release.py,scripts/wait_for_checks.py,release-baseline,release-required-checks}"
      instructions: |
        When release decisions or the check gate change, check
        that the tag, the checks and the publication refer to the same target_sha.
        Missing, pending or failed required checks must never
        count as passed. Check pagination and the latest
        result per check and issuer on reruns.
        On concurrent releases or retries, check that an
        existing tag's target is verified and that the same release is not
        published again with different content.
        Check stable versions, rc and promote against the parser
        and existing release anchors without bypassing the check gate.
