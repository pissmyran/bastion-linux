[project]
site_name = "Bastion för Linux"
site_url = "https://pissmyran.github.io/bastion_linux/"
site_description = "SSH-klienten för Linux-skrivbordet, skriven i Rust med GTK 4 och libadwaita."
repo_url = "https://github.com/pissmyran/bastion_linux"
repo_name = "pissmyran/bastion_linux"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Bastion – Apache-2.0"
nav = [
  { "Start" = "index.md" },
  { "Kom igång" = "kom-igang.md" },
  { "Arkitektur" = "arkitektur.md" },
  { "Drift och verifiering" = "drift.md" },
  { "Synkformat" = "synkformat.md" },
  { "Release" = "release.md" },
  { "RSA-nycklar" = "rsa-inaktiverat.md" },
]
extra_css = [
  "stylesheets/extra.css",
]

[project.extra]
platform = "Linux med GTK 4"
tagline = "SSH-klienten för Linux-skrivbordet, skriven i Rust med GTK 4 och libadwaita."

[project.theme]
variant = "modern"
language = "sv"
custom_dir = "overrides"
logo = "assets/bastion.svg"
favicon = "assets/bastion.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Följ systemets tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Byt till mörkt tema"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Byt till systemets tema"
