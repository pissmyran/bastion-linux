name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Describe the need first and the solution second. Avoid sensitive or private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Before suggesting
      options:
        - label: I have searched for an existing issue with the same or a similar suggestion.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Which problem are you trying to solve, or which need is there?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or result you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workflows you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant examples or screenshots without sensitive data.
