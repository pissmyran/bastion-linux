name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project.
        Do not report security vulnerabilities here, and never include passwords, tokens, private keys or other sensitive data in a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I have searched for an existing issue about the same problem.
          required: true
        - label: The report contains no secrets or other sensitive data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For example operating system, device, app version.
  - type: textarea
    id: details
    attributes:
      label: Logs, screenshots or other details
      description: Remove personal and sensitive data before attaching anything.
