title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Use this category for questions about Bastion, how it works or its documentation.

        For reproducible bugs or concrete feature requests, use Issues in the affected repository. Never report security vulnerabilities or secrets here.
  - type: checkboxes
    id: safety
    attributes:
      label: Check
      options:
        - label: The post contains no secrets, personal data or vulnerability details.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want help understanding or sorting out?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which project or situation the question is about, and what you have already tried.
    validations:
      required: true
