title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Use this category for suggestions that are not yet concrete enough for an issue.

        Once a suggestion is concrete and doable, it can be moved to an issue.
  - type: checkboxes
    id: safety
    attributes:
      label: Check
      options:
        - label: The post contains no secrets, personal data or vulnerability details.
          required: true
  - type: textarea
    id: need
    attributes:
      label: Problem or need
      description: Which problem, need or area for improvement is behind the idea?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Describe the solution or direction you want to discuss.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant examples, alternatives or limits. Avoid sensitive data.
